[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pl-predictor"
version = "0.1.0"
description = "Premier League match outcome predictor: Elo, Poisson goals model, and ML baselines with proper temporal validation."
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]
